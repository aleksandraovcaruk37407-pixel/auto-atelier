<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Авто-ателье">
    <title>Учет авто-ателье</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 20px; }
        h1 { margin-bottom: 10px; font-size: 28px; color: #1a3c5e; display: inline-block; }
        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { padding: 8px 18px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-export { background: #17a2b8; color: #fff; }
        .btn-import { background: #ffc107; color: #212529; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 24px; border: none; background: #e9ecef; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 15px; }
        .tab-btn.active { background: #1a3c5e; color: #fff; }
        .tab-content { display: none; animation: fade 0.3s; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { background: #1a3c5e; color: #fff; padding: 6px 3px; text-align: center; white-space: nowrap; }
        td { border: 1px solid #dde1e6; padding: 4px 2px; text-align: center; vertical-align: middle; }
        input, select, textarea { width: 100%; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 12px; background: #fff; }
        .btn-add { background: #28a745; color: #fff; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; margin: 10px 0; }
        .btn-del { background: #dc3545; color: #fff; border: none; padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .btn-sm { padding: 4px 12px; border: none; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-extra { background: #6c757d; color: #fff; border: none; padding: 4px 8px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .orders-list { margin-top: 10px; }
        .order-item { border: 1px solid #dee2e6; border-radius: 6px; margin-bottom: 8px; background: #fff; cursor: pointer; }
        .order-item.status-new { background: #d4edda; border-color: #28a745; }
        .order-item.status-middle { background: #fff3cd; border-color: #ffc107; }
        .order-item.status-critical { background: #f8d7da; border-color: #dc3545; }
        .order-item.status-done { background: #e9ecef; border-color: #6c757d; }
        .order-header { display: flex; align-items: center; padding: 10px 15px; gap: 10px; flex-wrap: wrap; }
        .order-header .order-number { font-weight: 700; color: #1a3c5e; min-width: 60px; }
        .order-header .order-date { color: #495057; min-width: 100px; }
        .order-header .order-deadline { color: #495057; min-width: 100px; }
        .order-header .order-client { font-weight: 600; flex: 1; }
        .order-header .order-phone { color: #495057; min-width: 120px; }
        .order-header .order-service { font-size: 14px; min-width: 120px; }
        .order-header .order-sum { font-weight: 700; min-width: 80px; }
        .order-header .order-sum.paid { color: #000; }
        .order-header .order-sum.unpaid { color: #dc3545; }
        .order-header .order-paid { display: flex; align-items: center; gap: 4px; font-size: 14px; min-width: 70px; }
        .order-header .color-indicator { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #dee2e6; }
        .color-indicator.new { background: #28a745; }
        .color-indicator.middle { background: #ffc107; }
        .color-indicator.critical { background: #dc3545; }
        .color-indicator.done { background: #6c757d; }
        .summary-block { background: #f8f9fa; padding: 16px; border-radius: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .summary-item { background: #fff; padding: 12px; border-radius: 8px; text-align: center; }
        .note { background: #fff3cd; padding: 12px; border-radius: 6px; margin: 10px 0; border-left: 4px solid #ffc107; font-size: 14px; }
        .scroll-wrap { overflow-x: auto; }
        .inline-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #fileInput { display: none; }
        input:disabled, select:disabled { background: #e9ecef; opacity: 0.7; }
        .ref-price-input { width: 100px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 15px; }
        .calendar-grid .day-name { font-weight: 600; text-align: center; background: #e9ecef; padding: 8px 0; border-radius: 6px; }
        .calendar-grid .day-cell { background: #f8f9fa; border-radius: 6px; padding: 10px 4px; text-align: center; cursor: pointer; min-height: 50px; border: 1px solid transparent; position: relative; }
        .calendar-grid .day-cell.selected { border-color: #1a3c5e; background: #cfe2ff; }
        .calendar-grid .day-cell .day-number { font-weight: 600; font-size: 16px; }
        .calendar-grid .day-cell .task-badge { position: absolute; top: 2px; right: 4px; background: #dc3545; color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; line-height: 18px; }
        .calendar-grid .day-cell.color-new { background: #d4edda; border-color: #28a745; }
        .calendar-grid .day-cell.color-middle { background: #fff3cd; border-color: #ffc107; }
        .calendar-grid .day-cell.color-critical { background: #f8d7da; border-color: #dc3545; }
        .calendar-grid .day-cell.color-done { background: #e9ecef; border-color: #6c757d; }
        .calendar-grid .day-cell.color-payment { background: #cce5ff; border-color: #007bff; }
        .calendar-grid .day-cell.color-note { background: #e6d9f5; border-color: #6f42c1; }
        .schedule-slot { border: 1px solid #dee2e6; border-radius: 4px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .schedule-slot.payment-slot { background: #cce5ff; }
        .schedule-slot.note-slot { background: #e6d9f5; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 12px; padding: 25px; max-width: 900px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 15px; color: #1a3c5e; }
        .modal .form-group { margin-bottom: 12px; }
        .modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
        .modal .form-actions button { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .modal .btn-cancel { background: #e9ecef; color: #212529; }
        .modal .btn-save { background: #28a745; color: #fff; }
        .color-select { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
        .color-select .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #dee2e6; cursor: pointer; }
        .color-btn.new { background: #28a745; }
        .color-btn.middle { background: #ffc107; }
        .color-btn.critical { background: #dc3545; }
        .color-btn.done { background: #6c757d; }
        .color-btn.auto { background: #fff; border-style: dashed; }
        .extra-item { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
        .manual-item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
        .service-row { border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fafbfc; }
        .service-row .service-header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .service-details { border-top: 1px solid #dee2e6; padding-top: 10px; }
        .service-details .section-title { font-weight: 600; color: #1a3c5e; margin: 8px 0 5px; }
        .footer-toolbar { margin-top: 30px; border-top: 1px solid #dee2e6; padding-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: space-between; }
        #unpaidSummary { margin: 5px 0 10px; font-weight: 600; color: #dc3545; background: #f8f9fa; padding: 6px 12px; border-radius: 6px; display: inline-block; }
        @media (max-width: 768px) {
            .order-header { flex-wrap: wrap; }
            .modal .form-row { grid-template-columns: 1fr; }
            .tab-btn { padding: 6px 14px; font-size: 13px; }
            .calendar-grid .day-cell { min-height: 40px; }
            .modal { padding: 15px; }
            .manual-item-row { flex-direction: column; align-items: stretch; }
            input, select, textarea { font-size: 16px !important; }
        }
        @media (max-width: 480px) {
            .toolbar .btn, .btn-add, .btn-extra, .btn-del, .btn-sm { padding: 10px 16px; font-size: 16px; min-height: 44px; }
            .tab-btn { flex: 1 0 auto; text-align: center; font-size: 16px; padding: 10px 15px; }
            .order-header { flex-direction: column; align-items: flex-start; }
            .modal { padding: 15px; max-width: 100%; border-radius: 10px; }
            .calendar-grid .day-cell { min-height: 44px; padding: 6px 2px; }
            .schedule-slot { padding: 12px; font-size: 16px; }
            input, select, textarea { font-size: 16px !important; min-height: 44px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <h1>🚗 Учет авто-ателье</h1>
        <div style="flex:1;"></div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="tab-orders">📋 Заказы</button>
        <button class="tab-btn" data-tab="tab-stock">📦 Склад</button>
        <button class="tab-btn" data-tab="tab-cash">💰 Деньги</button>
        <button class="tab-btn" data-tab="tab-summary">📊 Итоги</button>
        <button class="tab-btn" data-tab="tab-calendar">📅 Календарь</button>
        <button class="tab-btn" data-tab="tab-ref">📚 Справочники</button>
        <button class="tab-btn" data-tab="tab-purchase">📄 Закупка</button>
    </div>

    <!-- Вкладки ... (остальные вкладки идентичны предыдущему полному коду) -->

</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ДАННЫЕ ==========
    let colors = [], paints = [], films = [], extraRef = [], rates = [], ordersData = [], cashOps = [], bookings = [], materialTypes = [], regularExpenses = [], notes = [];
    let currentFilter = 'all';
    let currentDate = new Date();
    let selectedDate = new Date();
    let orderEditId = null;
    let currentManualColor = 'auto';
    let extraModalOrderId = null;
    let editingServiceIndex = null;
    let currentExtraData = {};
    let currentServices = [];

    // ========== ЗАГРУЗКА И СОХРАНЕНИЕ ==========
    function loadData() {
        colors = JSON.parse(localStorage.getItem('colors_data') || '[]');
        paints = JSON.parse(localStorage.getItem('paints_data') || '[]');
        films = JSON.parse(localStorage.getItem('films_data') || '[]');
        extraRef = JSON.parse(localStorage.getItem('extraRef_data') || '[]');
        rates = JSON.parse(localStorage.getItem('rates_data') || '[]');
        ordersData = JSON.parse(localStorage.getItem('orders_data') || '[]');
        cashOps = JSON.parse(localStorage.getItem('cash_data') || '[]');
        bookings = JSON.parse(localStorage.getItem('calendar_bookings') || '[]');
        materialTypes = JSON.parse(localStorage.getItem('materialTypes_data') || '[]');
        regularExpenses = JSON.parse(localStorage.getItem('regularExpenses_data') || '[]');
        notes = JSON.parse(localStorage.getItem('notes_data') || '[]');

        // Нормализация данных: исправляем некорректные даты
        normalizeData();

        if (!colors.length) {
            colors = [
                {category:'velour', code:'A1011', name:'Потолочная ткань (велюр)', price:1400},
                {category:'velour', code:'A1014', name:'Потолочная ткань (велюр)', price:1400},
                {category:'mesh', code:'L1041', name:'Потолочная ткань (сетка)', price:1400},
                {category:'mesh', code:'L1055', name:'Потолочная ткань (сетка) – Черный', price:1400}
            ];
        }
        if (!paints.length) {
            paints = [
                {category:'acrylic', code:'P001', name:'Краска черная', price:2.5},
                {category:'acrylic', code:'P002', name:'Краска белая', price:2.0},
                {category:'water', code:'P003', name:'Краска серая', price:2.2}
            ];
        }
        if (!films.length) {
            films = [
                {category:'Глянцевая', code:'FG-01', name:'Черный глянец', price:1200},
                {category:'Глянцевая', code:'FG-02', name:'Белый глянец', price:1200},
                {category:'Матовая', code:'FM-01', name:'Черный матовый', price:1100}
            ];
        }
        if (!extraRef.length) {
            extraRef = [
                {name:'Клей', unit:'мл', price:5},
                {name:'Растворитель', unit:'мл', price:3},
                {name:'Активатор', unit:'мл', price:10},
                {name:'Вибропласт', unit:'лист', price:500},
                {name:'Шумопоглощающий материал', unit:'м²', price:300},
                {name:'Клей для шумоизоляции', unit:'мл', price:5}
            ];
        }
        if (!rates.length) {
            rates = [
                {service:'Перетяжка потолка', usesFabric:true, usesPaint:false, usesFilm:false, items:[]},
                {service:'Восстановление после ДТП', usesFabric:true, usesPaint:true, usesFilm:false, items:[
                    {name:'Грунт для пластика', quantity:100, unit:'мл', price:2, perMeter:false, manual:true, enabled:true},
                    {name:'Шпаклёвка', quantity:200, unit:'г', price:0.5, perMeter:false, manual:true, enabled:true},
                    {name:'Обезжиреватель', quantity:150, unit:'мл', price:3, perMeter:false, manual:true, enabled:true}
                ]},
                {service:'Покраска пластика', usesFabric:false, usesPaint:true, usesFilm:false, items:[
                    {name:'Грунт для пластика', quantity:80, unit:'мл', price:2, perMeter:false, manual:true, enabled:true},
                    {name:'Обезжиреватель', quantity:100, unit:'мл', price:3, perMeter:false, manual:true, enabled:true},
                    {name:'Растворитель', quantity:50, unit:'мл', price:3, perMeter:false, manual:true, enabled:true}
                ]},
                {service:'Аквапринт', usesFabric:false, usesPaint:false, usesFilm:true, items:[
                    {name:'Активатор', quantity:200, unit:'мл', price:10, perMeter:false, manual:false, enabled:true}
                ]},
                {service:'Шумоизоляция', usesFabric:false, usesPaint:false, usesFilm:false, items:[
                    {name:'Вибропласт', quantity:3, unit:'лист', price:500, perMeter:false, manual:true, enabled:true},
                    {name:'Шумопоглощающий материал', quantity:4, unit:'м²', price:300, perMeter:false, manual:true, enabled:true},
                    {name:'Клей для шумоизоляции', quantity:200, unit:'мл', price:5, perMeter:false, manual:true, enabled:true}
                ]}
            ];
        }
        saveAll();
    }

    function normalizeData() {
        const fixDate = (obj, field) => {
            if (obj[field] && (obj[field] === 'null' || obj[field] === null || isNaN(new Date(obj[field]).getTime()))) {
                obj[field] = '';
            }
        };
        ordersData.forEach(o => fixDate(o, 'date'));
        cashOps.forEach(op => fixDate(op, 'date'));
        bookings.forEach(b => fixDate(b, 'date'));
        notes.forEach(n => fixDate(n, 'date'));
    }

    function saveAll() {
        localStorage.setItem('colors_data', JSON.stringify(colors));
        localStorage.setItem('paints_data', JSON.stringify(paints));
        localStorage.setItem('films_data', JSON.stringify(films));
        localStorage.setItem('extraRef_data', JSON.stringify(extraRef));
        localStorage.setItem('rates_data', JSON.stringify(rates));
        localStorage.setItem('orders_data', JSON.stringify(ordersData));
        localStorage.setItem('cash_data', JSON.stringify(cashOps));
        localStorage.setItem('calendar_bookings', JSON.stringify(bookings));
        localStorage.setItem('materialTypes_data', JSON.stringify(materialTypes));
        localStorage.setItem('regularExpenses_data', JSON.stringify(regularExpenses));
        localStorage.setItem('notes_data', JSON.stringify(notes));
    }

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function getOrderColorObj(order) {
        if (order.done) return 'done';
        if (order.manualColor && order.manualColor !== 'auto') return order.manualColor;
        const start = new Date(order.date);
        const now = new Date();
        const durDays = parseInt(order.durationDays) || 0;
        if (!order.date || durDays === 0) return 'new';
        const ratio = (now - start) / (1000*60*60*24) / durDays;
        if (ratio < 0.6) return 'new';
        if (ratio < 0.8) return 'middle';
        return 'critical';
    }
    function getDeadline(order) {
        if (!order.date || isNaN(new Date(order.date).getTime())) return '';
        const d = new Date(order.date);
        d.setDate(d.getDate() + (parseInt(order.durationDays) || 0));
        return d.toISOString().slice(0,10);
    }
    function formatDate(d) {
        if (!d || isNaN(d.getTime())) return '';
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function formatPhone(input) {
        let val = input.value.replace(/\D/g,'');
        if (val.startsWith('8')) val = '7'+val.slice(1);
        if (!val.startsWith('7')) val = '7'+val;
        if (val.length > 11) val = val.slice(0,11);
        input.value = '+'+val;
    }
    // Безопасная установка значения в input с датой
    function setDateInput(id, value) {
        const el = document.getElementById(id);
        if (el) el.value = value || '';
    }

    // ========== РАСЧЕТ СЕБЕСТОИМОСТИ ==========
    // ... (весь остальной код идентичен предыдущему полному коду)
    // Для краткости опущен, но в реальном файле он должен быть полностью.
    // Вставьте остальные функции из предыдущего ответа сюда без изменений.

</script>
</body>
</html>
